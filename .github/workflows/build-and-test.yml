name: Application Test and Build
on: 
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build 
  
      - name: Add android platform
        run: ionic cap add android
      
      - name: Build android platform
        run: npm run cap:build:android
      

