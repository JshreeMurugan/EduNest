name: Application Test and Build
on: 
  push:
    branches:
      - js-edunest-android-config
jobs:
  build-android:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build 
      
      - name: Remove excisting android platform
        run: npm run cap:remove:android:platform
  
      - name: Add android platform
        run: npx cap add android
      
      - name: Build android platform
        run: npm run cap:build:android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy-to-firebase:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
        - name: Download APK Artifact
          uses: actions/download-artifact@v4
          with:
              name: app-debug-apk
              path: android/app/build/outputs/apk/debug/

        - name: upload debug build to firebase app distribution
          uses: wzieba/Firebase-Distribution-Github-Action@v1
          with:
            appId: ${{ secrets.FIREBASE_APP_ID }}
            serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
            groups: internal-testers
            file: android/app/build/outputs/apk/debug/app-debug.apk


